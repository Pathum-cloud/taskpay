
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskPay Admin</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: grid;
      place-items: center;
      background: #101827;
      color: #f8fafc;
      font-family: Arial, sans-serif;
    }

    .panel {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      background: #1e293b;
      border-radius: 18px;
    }

    h1 { color: #34d399; margin-top: 0; }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 16px;
    }

    input {
      color: white;
      background: #0f172a;
      border: 1px solid #475569;
    }

    button {
      border: 0;
      background: #10b981;
      color: #052e25;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .5; }
    #status { overflow-wrap: anywhere; line-height: 1.5; }
    .hidden { display: none !important; }
  </style>
</head>

<body>
  <main class="panel">
    <h1>TaskPay Admin</h1>
    <p>Secure administrator login</p>

    <form id="loginForm">
      <input id="email" type="email"
        placeholder="Admin email"
        required autocomplete="username">

      <input id="password" type="password"
        placeholder="Password"
        required autocomplete="current-password">

      <button id="loginBtn" type="submit">Login</button>
    </form>

    <section id="dashboard" class="hidden">
      <h2>Admin Access Verified</h2>
      <p>You are signed in as an authorized administrator.</p>
      <p>Task management will be added next.</p>
      <button id="logoutBtn" type="button">Logout</button>
    </section>

    <p id="status" role="status">Connecting to secure login...</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Your TaskPay Supabase project settings
    const SUPABASE_URL =
      "https://ywkgamyqgvcdavgodrio.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_re5j7hCcARPhvl7eqYVLKA_EUvUGWjx";

    const statusEl = document.getElementById("status");
    const form = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const dashboard = document.getElementById("dashboard");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    let client = null;
    let busy = false;

    function showStatus(message) {
      statusEl.textContent = message;
    }

    function showLogin() {
      form.classList.remove("hidden");
      dashboard.classList.add("hidden");
    }

    function showDashboard() {
      form.classList.add("hidden");
      dashboard.classList.remove("hidden");
    }

    async function verifyAdmin(user) {
      const { data, error } = await client.rpc(
        "is_taskpay_admin"
      );

      if (error) {
        throw new Error(
          "Could not verify admin permissions. Check the Supabase function."
        );
      }

      if (data !== true) {
        await client.auth.signOut();
        showLogin();
        showStatus("Access denied: this account is not an admin.");
        return false;
      }

      showDashboard();
      showStatus("Admin verified: " + user.email);
      return true;
    }

    async function start() {
      if (
        SUPABASE_URL === "YOUR_PROJECT_URL" ||
        SUPABASE_PUBLISHABLE_KEY === "YOUR_PUBLISHABLE_KEY"
      ) {
        showStatus("Please add your Supabase URL and publishable key.");
        return;
      }

      if (!window.supabase) {
        showStatus(
          "Supabase library failed to load. Check your internet connection and reload."
        );
        return;
      }

      try {
        client = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY
        );

        const { data, error } = await client.auth.getSession();

        if (error) throw error;

        if (data.session) {
          await verifyAdmin(data.session.user);
        } else {
          showLogin();
          showStatus("Enter your administrator email and password.");
        }
      } catch (error) {
        showLogin();
        showStatus("Connection error: " + error.message);
      }
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (busy) return;

      if (!client) {
        showStatus(
          "Secure login is not ready. Check your internet and reload the page."
        );
        return;
      }

      busy = true;
      loginBtn.disabled = true;
      showStatus("Checking login and admin permissions...");

      try {
        const { data, error } = await client.auth.signInWithPassword({
          email: emailInput.value.trim(),
          password: passwordInput.value
        });

        if (error) throw error;

        await verifyAdmin(data.user);
      } catch (error) {
        showLogin();
        showStatus("Login failed: " + error.message);
      } finally {
        busy = false;
        loginBtn.disabled = false;
      }
    });

    document.getElementById("logoutBtn").addEventListener(
      "click", async function() {
        if (!client) return;

        const { error } = await client.auth.signOut();

        showLogin();
        showStatus(
          error ? "Logout failed. Please try again." : "Logged out successfully."
        );
      }
    );

    start();
  </script>
</body>
</html>
